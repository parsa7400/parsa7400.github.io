<!doctype html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#090d19">
  <meta name="description" id="pageDescription" content="وب‌سایت شخصی و نمونه‌کارها">
  <title>parsa7400 | نمونه‌کارها</title>

  <style>
    :root {
      color-scheme: dark;
      --bg: #090d19;
      --surface: #11182a;
      --surface-2: #172038;
      --text: #f4f6ff;
      --muted: #a5b2ca;
      --line: rgba(255, 255, 255, 0.11);
      --accent: #9061f9;
      --accent-2: #20c997;
      --accent-glow: rgba(144, 97, 249, 0.25);
      --danger: #fb7185;
      --radius: 20px;
      --max: 1160px;
      --shadow: 0 20px 50px rgba(0, 0, 0, 0.4);
      font-family: system-ui, -apple-system, "Segoe UI", Tahoma, sans-serif;
    }

    *, *::before, *::after { box-sizing: border-box; }
    html {
      scroll-behavior: smooth;
      scroll-padding-top: 85px;
      -webkit-tap-highlight-color: transparent;
    }
    body {
      margin: 0;
      min-width: 320px;
      color: var(--text);
      line-height: 1.8;
      background:
        radial-gradient(circle at 10% 12%, color-mix(in srgb, var(--accent) 18%, transparent), transparent 38%),
        radial-gradient(circle at 88% 28%, color-mix(in srgb, var(--accent-2) 14%, transparent), transparent 36%),
        radial-gradient(circle at 50% 85%, rgba(144, 97, 249, 0.08), transparent 45%),
        var(--bg);
      background-attachment: fixed;
      overflow-x: hidden;
    }
    [hidden] { display: none !important; }
    a { color: inherit; text-decoration: none; }
    button, input, textarea { font: inherit; color: inherit; }
    button { cursor: pointer; }
    :focus-visible { outline: 2px solid var(--accent-2); outline-offset: 3px; }
    ::selection { background: var(--accent); color: white; }

    .container { width: min(var(--max), calc(100% - 32px)); margin-inline: auto; }
    .muted { color: var(--muted); }
    .ltr { direction: ltr; text-align: left; }
    .stack { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
    .space-between { display: flex; justify-content: space-between; align-items: center; gap: 15px; flex-wrap: wrap; }

    /* نوار وضعیت اسکرول صفحه */
    #scrollProgress {
      position: fixed;
      top: 0;
      left: 0;
      height: 3px;
      width: 0%;
      background: linear-gradient(90deg, var(--accent), var(--accent-2));
      z-index: 100;
      transition: width 0.1s ease-out;
    }

    /* افکت‌های نوری پس‌زمینه */
    .orb {
      position: fixed;
      width: 420px;
      aspect-ratio: 1;
      border-radius: 50%;
      background: var(--accent);
      opacity: .09;
      filter: blur(95px);
      pointer-events: none;
      top: 15%;
      left: -140px;
      z-index: -1;
      animation: drift 15s ease-in-out infinite alternate;
    }
    .orb-2 {
      position: fixed;
      width: 320px;
      aspect-ratio: 1;
      border-radius: 50%;
      background: var(--accent-2);
      opacity: .07;
      filter: blur(85px);
      pointer-events: none;
      bottom: 12%;
      right: -100px;
      z-index: -1;
      animation: drift 12s ease-in-out infinite alternate-reverse;
    }
    @keyframes drift { to { transform: translate(100px, 90px) scale(1.1); } }

    /* انیمیشن ظاهر شدن روان در زمان اسکرول */
    .scroll-reveal {
      opacity: 0;
      transform: translateY(28px);
      transition: opacity 0.7s cubic-bezier(0.16, 1, 0.3, 1), transform 0.7s cubic-bezier(0.16, 1, 0.3, 1);
      will-change: opacity, transform;
    }
    .scroll-reveal.is-visible {
      opacity: 1;
      transform: translateY(0);
    }

    @keyframes floatCard {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-8px); }
    }

    /* نوار ناوبری صاف، شیشه‌ای و دقیق */
    .topbar {
      position: sticky;
      top: 0;
      left: 0;
      right: 0;
      width: 100%;
      z-index: 1000;
      background: rgba(9, 13, 25, 0.88);
      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);
      border-bottom: 1px solid var(--line);
      border-radius: 0 !important;
      margin: 0;
      padding: 0;
    }
    .nav {
      min-height: 64px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      flex-wrap: nowrap; /* ممانعت قطعی از افتادن لینک‌ها به خط بعد */
    }
    .brand {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      font-weight: 800;
      font-size: 15px;
      white-space: nowrap;
      flex-shrink: 0;
    }
    .brand-mark {
      width: 36px;
      height: 36px;
      display: grid;
      place-items: center;
      border-radius: 10px;
      border: 1px solid color-mix(in srgb, var(--accent) 55%, transparent);
      background: linear-gradient(140deg, var(--accent), var(--accent-2));
      box-shadow: 0 4px 16px var(--accent-glow);
      color: white;
      font: bold 13px ui-monospace, monospace;
      transition: transform .25s ease;
      flex-shrink: 0;
    }
    .brand:hover .brand-mark { transform: rotate(8deg) scale(1.05); }

    .nav-links {
      display: flex;
      align-items: center;
      gap: 12px;
      font-size: 13.5px;
      margin: 0;
      padding: 0;
      list-style: none;
      flex-wrap: nowrap;
      white-space: nowrap;
    }
    .nav-links[hidden] {
      display: none !important;
    }
    .nav-links a:not(.btn) {
      color: var(--muted);
      transition: color .2s, background .2s;
      white-space: nowrap;
      padding: 6px 10px;
      border-radius: 8px;
    }
    .nav-links a:not(.btn):hover {
      color: #fff;
      background: rgba(255, 255, 255, 0.05);
    }
    #langToggle {
      flex-shrink: 0;
    }

    /* دکمه‌ها و عناصر تعاملی */
    .btn, .chip {
      border: 1px solid var(--line);
      background: rgba(255, 255, 255, 0.045);
      color: var(--text);
      border-radius: 12px;
      min-height: 44px;
      display: inline-flex;
      justify-content: center;
      align-items: center;
      gap: 8px;
      padding: 8px 18px;
      font-weight: 700;
      font-size: 13px;
      transition: transform .2s, border-color .2s, background .2s, box-shadow .2s;
      touch-action: manipulation;
    }
    .btn:hover:not(:disabled), .chip:hover {
      transform: translateY(-2px);
      border-color: color-mix(in srgb, var(--accent) 55%, white 10%);
      background: rgba(255, 255, 255, 0.09);
    }
    .btn:active:not(:disabled) { transform: scale(0.97); }
    .btn:disabled { opacity: .55; cursor: wait; }
    .btn-primary {
      background: linear-gradient(130deg, var(--accent), #6552d9);
      border-color: transparent;
      color: white;
      box-shadow: 0 6px 24px var(--accent-glow);
    }
    .btn-danger { color: #ffc1ca; border-color: rgba(251, 113, 133, 0.35); background: rgba(251, 113, 133, 0.08); }
    .btn-small { min-height: 38px; padding: 6px 13px; font-size: 12px; }
    .chip { min-height: 36px; border-radius: 99px; color: var(--muted); }
    .chip.active { color: white; background: color-mix(in srgb, var(--accent) 25%, transparent); border-color: var(--accent); }

    /* سکشن‌ها و لایه‌بندی */
    main > section { padding-block: 55px; }
    .hero {
      min-height: 540px;
      display: grid;
      grid-template-columns: 1.15fr .85fr;
      align-items: center;
      gap: 40px;
      padding-block: 70px 50px;
    }
    .eyebrow {
      color: var(--accent-2);
      font-weight: 800;
      font-size: 12px;
      letter-spacing: .04em;
    }
    .availability {
      display: inline-flex;
      align-items: center;
      gap: 9px;
      padding: 6px 13px;
      border-radius: 99px;
      background: color-mix(in srgb, var(--accent-2) 10%, transparent);
      border: 1px solid color-mix(in srgb, var(--accent-2) 35%, transparent);
      margin-bottom: 18px;
      color: var(--accent-2);
      font-size: 13px;
    }
    .dot {
      width: 8px; height: 8px;
      background: currentColor;
      border-radius: 50%;
      box-shadow: 0 0 13px currentColor;
    }
    h1, h2, h3, h4, p { margin-top: 0; }
    h1 { font-size: clamp(34px, 5.5vw, 62px); line-height: 1.2; margin-bottom: 16px; font-weight: 900; }
    h2 { font-size: clamp(25px, 3.5vw, 36px); line-height: 1.35; font-weight: 800; }
    .gradient-text {
      background: linear-gradient(110deg, #cabaff, var(--accent-2), #f6a2d7);
      background-clip: text;
      -webkit-background-clip: text;
      color: transparent;
    }
    .lead { max-width: 650px; font-size: 17px; color: var(--muted); margin-bottom: 24px; }
    
    /* پنل‌ها و کارت‌ها */
    .panel, .profile-card, .project-card, .form-card {
      background: linear-gradient(155deg, rgba(24, 32, 53, 0.85), rgba(14, 20, 36, 0.92));
      border: 1px solid var(--line);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
    }
    .panel, .form-card { padding: 26px; }
    .profile-card { padding: 30px; animation: floatCard 6s ease-in-out infinite; }
    .profile-top { display: flex; gap: 16px; align-items: center; margin-bottom: 18px; }
    .avatar {
      width: 72px; height: 72px;
      object-fit: cover;
      border-radius: 20px;
      display: grid;
      place-items: center;
      background: linear-gradient(140deg, var(--accent), var(--accent-2));
      color: white;
      font-size: 26px;
      font-weight: 900;
      flex: none;
      box-shadow: 0 6px 20px var(--accent-glow);
    }
    .profile-top h3 { margin: 0; font-size: 20px; overflow-wrap: anywhere; }
    .profile-top p { margin: 0; font-size: 13px; color: var(--muted); }
    .pill {
      display: inline-flex;
      padding: 4px 11px;
      border: 1px solid var(--line);
      background: rgba(255, 255, 255, 0.04);
      border-radius: 9px;
      color: var(--muted);
      font-size: 12px;
    }
    .section-head { margin-bottom: 25px; }
    .section-head h2 { margin: 5px 0; }
    .section-head p { color: var(--muted); margin: 0; font-size: 14px; }
    .body-copy { white-space: pre-line; color: var(--muted); margin: 0; }
    
    .skills-grid, .projects-grid { display: grid; gap: 18px; }
    .skills-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    .projects-grid { grid-template-columns: repeat(auto-fit, minmax(min(100%, 310px), 1fr)); }
    
    .skill {
      padding: 18px;
      border: 1px solid var(--line);
      border-radius: 14px;
      background: rgba(255, 255, 255, 0.025);
      transition: transform .25s, border-color .25s;
    }
    .skill:hover { transform: translateY(-2px); border-color: color-mix(in srgb, var(--accent) 45%, transparent); }
    .skill-title { display: flex; justify-content: space-between; gap: 10px; font-size: 14px; font-weight: 700; }
    .skill-title b { color: var(--accent-2); }
    .meter { height: 7px; background: rgba(255, 255, 255, 0.09); border-radius: 30px; margin-top: 12px; overflow: hidden; }
    .meter > span {
      display: block;
      height: 100%;
      width: 0%;
      border-radius: inherit;
      background: linear-gradient(90deg, var(--accent), var(--accent-2));
      transition: width 1.1s cubic-bezier(0.16, 1, 0.3, 1);
    }
    
    .filters { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; margin-bottom: 22px; }
    .filters input { flex: 1 1 220px; }
    .chips { display: flex; gap: 8px; flex-wrap: wrap; }
    
    .project-card {
      display: flex;
      flex-direction: column;
      padding: 24px;
      transition: transform .3s cubic-bezier(0.16, 1, 0.3, 1), border-color .3s, box-shadow .3s;
    }
    .project-card:hover {
      transform: translateY(-6px);
      border-color: color-mix(in srgb, var(--accent) 60%, transparent);
      box-shadow: 0 25px 55px rgba(0, 0, 0, 0.4);
    }
    .project-head { display: flex; justify-content: space-between; align-items: flex-start; gap: 10px; }
    .project-head h3 { font-size: 18px; line-height: 1.4; }
    .project-card p { color: var(--muted); font-size: 14px; white-space: pre-line; flex: 1; }
    .tech { color: var(--accent-2); font-size: 12px; overflow-wrap: anywhere; }
    .project-links { margin-top: 18px; }
    
    .contact-box {
      padding: 30px;
      border: 1px solid color-mix(in srgb, var(--accent) 40%, transparent);
      border-radius: var(--radius);
      background: linear-gradient(125deg,
        color-mix(in srgb, var(--accent) 16%, var(--surface)),
        color-mix(in srgb, var(--accent-2) 9%, var(--surface)));
    }
    .empty { grid-column: 1 / -1; text-align: center; color: var(--muted); padding: 35px; }

    /* پنل مدیریت ادمین */
    .admin-shell { max-width: 1100px; padding-block: 35px 95px; }
    .admin-header { margin-bottom: 25px; }
    .admin-header h1 { font-size: 30px; }
    .admin-sections { display: grid; gap: 20px; }
    .form-card h2 { font-size: 21px; margin-bottom: 16px; }
    .grid-2 { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px; }
    .form-group { min-width: 0; margin-bottom: 14px; }
    label { display: block; color: var(--muted); font-size: 13px; font-weight: 700; margin-bottom: 7px; }
    .field {
      width: 100%;
      min-height: 44px;
      border: 1px solid var(--line);
      border-radius: 11px;
      background: rgba(255, 255, 255, 0.05);
      color: var(--text);
      padding: 10px 14px;
      outline: none;
      transition: border-color .2s;
    }
    .field:focus { border-color: var(--accent); }
    textarea.field { min-height: 105px; resize: vertical; }
    input[type="color"].field { padding: 4px; height: 46px; cursor: pointer; }
    .hint { color: var(--muted); font-size: 12px; }
    .notice {
      border: 1px solid rgba(245, 158, 11, 0.4);
      background: rgba(245, 158, 11, 0.08);
      padding: 13px 16px;
      border-radius: 11px;
      font-size: 13px;
      margin-bottom: 18px;
    }
    .editor-row {
      padding: 15px;
      border: 1px solid var(--line);
      border-radius: 13px;
      margin-bottom: 10px;
      background: rgba(255, 255, 255, 0.025);
    }
    .row-fields { display: grid; grid-template-columns: 1fr 1fr 100px; gap: 10px; }
    .row-actions { display: flex; justify-content: flex-end; gap: 6px; flex-wrap: wrap; margin-top: 9px; }

    /* نوار ابزار پایین ادمین - بهینه‌شده برای موبایل */
    .admin-tools {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      z-index: 60;
      display: flex;
      gap: 10px;
      align-items: center;
      justify-content: space-between;
      padding: 12px 18px;
      padding-bottom: max(12px, env(safe-area-inset-bottom));
      border-top: 1px solid var(--line);
      background: rgba(15, 21, 37, 0.95);
      box-shadow: 0 -10px 30px rgba(0, 0, 0, 0.5);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
    }
    .admin-tools .stack {
      flex: 1;
      justify-content: flex-end;
      overflow-x: auto;
      flex-wrap: nowrap;
      padding-bottom: 2px;
      -webkit-overflow-scrolling: touch;
    }
    .admin-tools .btn { flex-shrink: 0; }

    .toast {
      position: fixed;
      bottom: 75px;
      left: 50%;
      z-index: 100;
      transform: translateX(-50%);
      padding: 12px 22px;
      border: 1px solid var(--line);
      border-radius: 12px;
      background: #1e293b;
      box-shadow: var(--shadow);
      max-width: min(92vw, 550px);
      text-align: center;
      font-weight: 600;
    }
    .site-warning {
      margin-top: 18px;
      border: 1px solid rgba(245, 158, 11, 0.35);
      border-radius: 12px;
      padding: 9px 13px;
      color: #ffdda3;
      font-size: 13px;
    }
    footer {
      border-top: 1px solid var(--line);
      color: var(--muted);
      text-align: center;
      padding: 30px 18px;
      padding-bottom: calc(30px + env(safe-area-inset-bottom));
      font-size: 13px;
    }

    @media (max-width: 850px) {
      .hero { grid-template-columns: 1fr; min-height: unset; padding-top: 40px; gap: 32px; }
      .profile-card { animation: none; }
      
      /* هدر صاف و تک‌خطی در موبایل */
      .nav {
        min-height: 56px;
        gap: 8px;
        flex-wrap: nowrap; /* بدون شکستگی خط */
      }
      .brand span:last-child {
        font-size: 14px;
      }
      .nav-links {
        gap: 6px;
        overflow-x: auto; /* اسکرول افقی نرم اگر تعداد لینک‌ها در صفحه کوچک زیاد شد */
        scrollbar-width: none;
        -webkit-overflow-scrolling: touch;
      }
      .nav-links::-webkit-scrollbar {
        display: none;
      }
      .nav-links a:not(.btn) {
        padding: 5px 7px;
        font-size: 12px;
      }
      .btn-small {
        min-height: 32px;
        padding: 4px 9px;
        font-size: 11.5px;
      }
    }
    @media (max-width: 620px) {
      main > section { padding-block: 36px; }
      .skills-grid, .grid-2, .row-fields { grid-template-columns: 1fr; }
      .panel, .form-card, .profile-card { padding: 18px; border-radius: 16px; }
      .avatar { width: 62px; height: 62px; font-size: 22px; }
      #saveState { display: none; } /* در گوشی‌های خیلی باریک برای باز شدن جا برای دکمه‌ها */
    }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: .01ms !important;
        transition-duration: .01ms !important;
        scroll-behavior: auto !important;
      }
    }
    
    /* جلوه درخشش نوار مهارت‌ها */
    .meter {
      position: relative;
      background: rgba(255, 255, 255, 0.08);
      border-radius: 99px;
      overflow: hidden;
    }
    .meter > span {
      position: relative;
      overflow: hidden;
      box-shadow: 0 0 12px var(--accent-glow);
    }
    .meter > span::after {
      content: '';
      position: absolute;
      top: 0; left: 0; right: 0; bottom: 0;
      background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.35), transparent);
      transform: translateX(-100%);
      animation: shimmer 2.2s infinite;
    }
    @keyframes shimmer {
      100% { transform: translateX(100%); }
    }

    /* پرسپکتیو برای جلوه ۳بعدی تعاملی */
    .project-card, .profile-card {
      transition: transform 0.2s cubic-bezier(0.2, 0, 0.2, 1), box-shadow 0.2s ease, border-color 0.2s ease;
      will-change: transform;
      transform-style: preserve-3d;
    }

    /* کرسر چشمک‌زن افکت تایپ در Hero */
    .typing-cursor {
      display: inline-block;
      width: 2px;
      height: 1.1em;
      vertical-align: middle;
      background-color: var(--accent-2);
      margin-inline-start: 4px;
      animation: blink 0.8s infinite;
    }
    @keyframes blink {
      0%, 100% { opacity: 1; }
      50% { opacity: 0; }
    }

    /* جلوه ریپل هنگام کلیک روی دکمه‌ها */
    .btn {
      position: relative;
      overflow: hidden;
    }
    .btn .ripple-wave {
      position: absolute;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.35);
      transform: scale(0);
      animation: rippleEffect 0.6s linear;
      pointer-events: none;
    }
    @keyframes rippleEffect {
      to {
        transform: scale(4);
        opacity: 0;
      }
    }

  </style>
</head>

<body>
  <div id="scrollProgress"></div>
  <div class="orb" aria-hidden="true"></div>
  <div class="orb-2" aria-hidden="true"></div>

  <header class="topbar">
    <div class="container nav">
      <a class="brand" href="./" aria-label="Home">
        <span class="brand-mark">&lt;/&gt;</span>
        <span id="navName">parsa7400</span>
      </a>

      <nav class="nav-links" id="publicNav" aria-label="Main navigation">
        <a href="#about" data-copy="navAbout"></a>
        <a href="#skills" data-copy="navSkills"></a>
        <a href="#projects" data-copy="navProjects"></a>
        <a href="#contact" data-copy="navContact"></a>
        <a class="btn btn-small" href="?admin=1" data-copy="navAdmin"></a>
      </nav>

      <nav class="nav-links" id="adminNav" hidden aria-label="Admin navigation">
        <button class="btn btn-small" type="button" id="backToEditor" hidden></button>
        <a class="btn btn-small" href="./" id="backToSite"></a>
      </nav>

      <button class="btn btn-small" type="button" id="langToggle" aria-label="Switch language">English</button>
    </div>
  </header>

  <main id="siteView">
    <section class="container hero">
      <div class="reveal">
        <div class="availability" id="availabilityBox">
          <span class="dot"></span><span id="availabilityText"></span>
        </div>
        <h1><span data-copy="hello"></span> <span class="gradient-text" id="heroName"></span></h1>
        <p class="lead" id="heroRole"></p>
        <div class="stack">
          <a href="#projects" class="btn btn-primary" data-copy="heroProjects"></a>
          <a href="#contact" class="btn" data-copy="heroContact"></a>
        </div>
        <div class="site-warning" id="siteWarning" hidden></div>
      </div>

      <div class="profile-card">

  <script>
    // اسکریپت کنترل انیمیشن‌های مبتنی بر اسکرول
    window.addEventListener('scroll', () => {
      const winScroll = document.documentElement.scrollTop;
      const height = document.documentElement.scrollHeight - document.documentElement.clientHeight;
      const scrolled = (winScroll / height) * 100;
      const progressBar = document.getElementById('scrollProgress');
      if (progressBar) progressBar.style.width = scrolled + '%';
    }, { passive: true });

    // باز شدن المان‌ها به محض رسیدن به دید کاربر در اسکرول
    const observer = new IntersectionObserver((entries) => {
      entries.forEach(entry => {
        if (entry.isIntersecting) {
          entry.target.classList.add('is-visible');
          // انیمیشن پر شدن نوارهای مهارت
          entry.target.querySelectorAll('.meter > span').forEach(span => {
            span.style.width = span.getAttribute('data-level') || span.style.width;
          });
        }
      });
    }, { threshold: 0.12 });

    document.querySelectorAll('.scroll-reveal').forEach(el => observer.observe(el));

/* =========================================================
   ۱. انیمیشن کاملاً هم‌زمان شمارش درصد و پر شدن نوار
   ========================================================= */
function animateSkillBarsAndNumbers() {
  const skillsSection = document.getElementById('skills');
  if (!skillsSection) return;

  const observer = new IntersectionObserver((entries, obs) => {
    entries.forEach(entry => {
      if (entry.isIntersecting) {
        const skillItems = entry.target.querySelectorAll('.skill');

        skillItems.forEach((skill, index) => {
          // تاخیر پله‌ای برای هر ردیف مهارت
          setTimeout(() => {
            const meterSpan = skill.querySelector('.meter > span');
            const percentLabel = skill.querySelector('.skill-title b');
            if (!meterSpan || !percentLabel) return;

            const targetVal = parseInt(meterSpan.getAttribute('data-target') || '0', 10);
            if (targetVal <= 0) {
              meterSpan.style.width = '0%';
              percentLabel.textContent = '0%';
              return;
            }

            const duration = 1200; // مدت کل انیمیشن: ۱.۲ ثانیه
            let startTime = null;

            function step(currentTime) {
              if (!startTime) startTime = currentTime;
              const elapsed = currentTime - startTime;
              // محاسبه درصد پیشرفت از 0 تا 1
              const progress = Math.min(elapsed / duration, 1);

              // استفاده از تابع سهولت (Ease-Out) برای نرم شدن در انتها
              const easeOut = 1 - Math.pow(1 - progress, 3);

              // مقدار لحظه‌ای دقیق هم برای نوار و هم برای عدد
              const currentVal = Math.round(easeOut * targetVal);

              meterSpan.style.width = (easeOut * targetVal) + '%';
              percentLabel.textContent = currentVal + '%';

              if (progress < 1) {
                requestAnimationFrame(step);
              } else {
                // اطمینان از قرار گرفتن دقیق روی عدد نهایی
                meterSpan.style.width = targetVal + '%';
                percentLabel.textContent = targetVal + '%';
              }
            }

            requestAnimationFrame(step);

          }, index * 100);
        });

        obs.unobserve(entry.target);
      }
    });
  }, { threshold: 0.2 });

  observer.observe(skillsSection);
}

/* =========================================================
   ۲. افکت تایپ متن عنوان شغلی (Typewriter Effect)
   ========================================================= */
function initTypewriter(text) {
  const roleElem = document.getElementById('heroRole');
  if (!roleElem || !text) return;

  roleElem.innerHTML = '';
  const cursor = document.createElement('span');
  cursor.className = 'typing-cursor';

  let i = 0;
  const speed = 40; // سرعت تایپ

  function type() {
    if (i < text.length) {
      roleElem.textContent = text.slice(0, i + 1);
      roleElem.appendChild(cursor);
      i++;
      setTimeout(type, speed);
    }
  }
  type();
}

/* =========================================================
   ۳. افکت سه‌بعدی Tilt روی کارت‌ها با حرکت موس
   ========================================================= */
function init3DTiltCards() {
  const cards = document.querySelectorAll('.project-card, .profile-card');
  
  cards.forEach(card => {
    card.addEventListener('mousemove', e => {
      const rect = card.getBoundingClientRect();
      const x = e.clientX - rect.left;
      const y = e.clientY - rect.top;
      
      const centerX = rect.width / 2;
      const centerY = rect.height / 2;
      
      const rotateX = ((y - centerY) / centerY) * -7;
      const rotateY = ((x - centerX) / centerX) * 7;
      
      card.style.transform = `perspective(1000px) rotateX(${rotateX}deg) rotateY(${rotateY}deg) translateY(-4px)`;
    });

    card.addEventListener('mouseleave', () => {
      card.style.transform = 'perspective(1000px) rotateX(0deg) rotateY(0deg) translateY(0)';
    });
  });
}

/* =========================================================
   ۴. افکت کلیک موجی روی تمام دکمه‌ها (Ripple Effect)
   ========================================================= */
function initButtonRipples() {
  document.addEventListener('click', e => {
    const btn = e.target.closest('.btn');
    if (!btn) return;

    const circle = document.createElement('span');
    const diameter = Math.max(btn.clientWidth, btn.clientHeight);
    const radius = diameter / 2;
    const rect = btn.getBoundingClientRect();

    circle.style.width = circle.style.height = `${diameter}px`;
    circle.style.left = `${e.clientX - rect.left - radius}px`;
    circle.style.top = `${e.clientY - rect.top - radius}px`;
    circle.classList.add('ripple-wave');

    const ripple = btn.querySelector('.ripple-wave');
    if (ripple) ripple.remove();

    btn.appendChild(circle);
    setTimeout(() => circle.remove(), 600);
  });
}

/* =========================================================
   اجرا هنگام لود صفحه
   ========================================================= */
window.addEventListener('DOMContentLoaded', () => {
  animateSkillBarsAndNumbers();
  init3DTiltCards();
  initButtonRipples();
});    
  </script>

    function normalize(raw) {
      if (!raw || typeof raw !== "object" || Array.isArray(raw)) throw new Error("Invalid JSON root");

      const arr = value => Array.isArray(value) ? value : [];
      const defaults = clone(INITIAL);
      const data = {

          en: Object.fromEntries(Object.keys(DEFAULT_COPY.en).map(k => [k, text(raw.ui?.en?.[k] ?? DEFAULT_COPY.en[k])]))

      };
      return data;
    }

    function validHttpUrl(value) {
      if (!value) return "";
      try {
        const url = new URL(value);
        return ["http:", "https:"].includes(url.protocol) ? url.href : "";
      } catch {
        return "";
      }
    }

    function addLink(container, label, href, primary = false) {
      const url = validHttpUrl(href);
      if (!url) return;
      const link = make("a", "btn btn-small" + (primary ? " btn-primary" : ""), label);
      link.href = url;
      link.target = "_blank";
      link.rel = "noopener noreferrer";
      container.append(link);
    }

    function field(labelText, value, options = {}) {
      const wrap = make("div", "form-group");
      const label = make("label", "", labelText);
      const input = make(options.multiline ? "textarea" : "input", "field", "");
      if (!options.multiline) input.type = options.type || "text";
      if (options.ltr) input.classList.add("ltr");
      input.value = value ?? "";
      if (options.required) input.required = true;
      if (options.placeholder) input.placeholder = options.placeholder;
      if (options.min != null) input.min = options.min;
      if (options.max != null) input.max = options.max;
      label.append(input);
      wrap.append(label);
      return { wrap, input };
    }

    function bilingualFields(container, key, value, options = {}) {
      const grid = make("div", "grid-2");
      LANGS.forEach(lang => {
        const title = adminText(key) + " — " + adminText(lang);
        const control = field(title, value?.[lang] ?? "", {
          ...options, ltr: lang === "en"
        });
        control.input.dataset.field = key;
        control.input.dataset.lang = lang;
        grid.append(control.wrap);
      });
      container.append(grid);
    }

    function flushProjectDraft() {
      if (!projectDraftDirty) return true;
      const form = $("#projectForm");
      if (!form.reportValidity()) return false;

      const read = (key, lang) =>
        [...form.querySelectorAll("[data-field]")].find(input =>
          input.dataset.field === key && (lang ? input.dataset.lang === lang : !input.dataset.lang)
        )?.value.trim() ?? "";

      const name = { fa: read("name", "fa"), en: read("name", "en") };
      if (!name.fa || !name.en) {
        notify(adminText("missingProject"));
        return false;
      }

      const url = read("url");
      const demo = read("demo");
      if ((url && !validHttpUrl(url)) || (demo && !validHttpUrl(demo))) {
        notify(adminText("badUrl"));
        return false;
      }

      const payload = {
        id: editingProjectId || newId(),
        name,
        category: { fa: read("category", "fa"), en: read("category", "en") },
        language: { fa: read("language", "fa"), en: read("language", "en") },
        description: { fa: read("description", "fa"), en: read("description", "en") },
        url,
        demo
      };

      if (editingProjectId) {
        const index = currentData.projects.findIndex(p => p.id === editingProjectId);
        if (index < 0) return false;
        currentData.projects[index] = payload;
      } else {
        currentData.projects.unshift(payload);
      }

      resetProjectForm();
      renderProjectEditorList();
      markDirty();
      notify(adminText("added"));
      return true;
    }

    function moveItem(list, id, delta) {
      const index = list.findIndex(item => item.id === id);
      const target = index + delta;
      if (index < 0 || target < 0 || target >= list.length) return false;
      [list[index], list[target]] = [list[target], list[index]];
      return true;
    }

    function bindListEditor(containerSelector, listName, render) {
      const box = $(containerSelector);
      box.addEventListener("input", event => {
        const input = event.target.closest("[data-id][data-key]");
        if (!input) return;
        const item = currentData[listName].find(x => x.id === input.dataset.id);
        if (!item) return;

        if (input.dataset.key === "name") item.name[input.dataset.lang] = input.value;
        else if (input.dataset.key === "level") {
          const n = Number(input.value);
          item.level = Number.isFinite(n) ? Math.max(0, Math.min(100, n)) : 0;
        } else item[input.dataset.key] = input.value;
        markDirty();
      });

      box.addEventListener("click", event => {
        const button = event.target.closest("button[data-action]");
        if (!button) return;
        const { action, id } = button.dataset;
        const list = currentData[listName];

        if (action === "delete") {
          if (!confirm(adminText("confirmDelete"))) return;
          const index = list.findIndex(x => x.id === id);
          if (index < 0) return;
          list.splice(index, 1);
        } else if (action === "up" || action === "down") {
          if (!moveItem(list, id, action === "up" ? -1 : 1)) return;
        } else return;

        render();
        markDirty();
      });
    }

    /* اتصال به GitHub: توکن هرگز در localStorage یا فایل ذخیره نمی‌شود. */
    function apiBase() {
      const owner = encodeURIComponent(CONFIG.owner.trim());
      const repo = encodeURIComponent(CONFIG.repo.trim());
      return `https://api.github.com/repos/${owner}/${repo}`;
    }

    function contentsEndpoint() {
      const path = CONFIG.path.split("/").map(encodeURIComponent).join("/");
      return `/contents/${path}`;
    }

    async function github(endpoint, options = {}) {
      const headers = {
        Accept: "application/vnd.github+json",
        "X-GitHub-Api-Version": "2022-11-28",
        ...(options.headers || {})
      };
      if (memoryToken) headers.Authorization = `Bearer ${memoryToken}`;

      const response = await fetch(apiBase() + endpoint, {
        ...options, headers, cache: "no-store"
      });
      const body = await response.json().catch(() => ({}));
      if (!response.ok) {
        const error = new Error(body.message || `GitHub HTTP ${response.status}`);
        error.status = response.status;
        throw error;
      }
      return body;
    }

    function decodeBase64Utf8(value) {
      const binary = atob(value.replace(/\s/g, ""));
      const bytes = Uint8Array.from(binary, char => char.charCodeAt(0));
      return new TextDecoder().decode(bytes);
    }

    function encodeBase64Utf8(value) {
      const bytes = new TextEncoder().encode(value);
      let binary = "";
      for (let i = 0; i < bytes.length; i += 8192) {
        binary += String.fromCharCode(...bytes.subarray(i, i + 8192));
      }
      return btoa(binary);
    }

    async function readRemoteFile() {
      try {
        const remote = await github(
          contentsEndpoint() + "?ref=" + encodeURIComponent(CONFIG.branch)
        );
        if (remote.type !== "file" || !remote.content || !remote.sha) {
          throw new Error("GitHub file content is unavailable or too large.");
        }
        return remote;
      } catch (error) {
        if (error.status === 404) return null;
        throw error;
      }
    }

    function validateBeforeSave() {
      if (!currentData.name.fa.trim() || !currentData.name.en.trim()) {
        notify(adminText("missingName"));
        return false;
      }
      const email = currentData.email.trim();
      if (email && !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) {
        notify(adminText("badEmail"));
        return false;
      }
      const links = [
        currentData.avatarUrl,
        ...currentData.socials.map(x => x.url),
        ...currentData.projects.flatMap(x => [x.url, x.demo])
      ];
      if (links.some(url => url.trim() && !validHttpUrl(url.trim()))) {
        notify(adminText("badUrl"));
        return false;
      }
      if (currentData.projects.some(p => !p.name.fa.trim() || !p.name.en.trim())) {
        notify(adminText("missingProject"));
        return false;
      }
      if (currentData.skills.some(s => s.level < 0 || s.level > 100)) {
        notify(adminText("level") + ": 0–100");
        return false;
      }
      return true;
    }

    function showPreview(enabled) {
      previewing = enabled;
      $("#siteView").hidden = !enabled;
      $("#adminView").hidden = enabled;
      $("#publicNav").hidden = true;
      $("#adminNav").hidden = false;
      $("#backToEditor").hidden = !enabled;
      $("#backToSite").hidden = enabled;
      if (enabled) renderPublic();
      window.scrollTo({ top: 0, behavior: "smooth" });
    }

    $("#langToggle").addEventListener("click", () => {
      currentLang = currentLang === "fa" ? "en" : "fa";
      applyLanguage();
    });

    $("#searchBox").addEventListener("input", renderProjects);

    $("#loginForm").addEventListener("submit", async event => {
      event.preventDefault();
      if (!CONFIG.owner || !CONFIG.repo ||
          CONFIG.owner.startsWith("YOUR_") || CONFIG.repo.startsWith("YOUR_")) {
        notify(adminText("configMissing"));
        return;
      }

      const token = $("#patInput").value.trim();
      if (!token) return;

      const button = $("#loginButton");
      button.disabled = true;
      button.textContent = adminText("loading");

      try {
        memoryToken = token;
        await github("");
        await github("/branches/" + encodeURIComponent(CONFIG.branch));
        const remote = await readRemoteFile();

        currentData = remote
          ? normalize(JSON.parse(decodeBase64Utf8(remote.content)))
          : normalize(INITIAL);
        fileSha = remote?.sha ?? null;
        savedData = clone(currentData);
        dirty = false;

        $("#patInput").value = "";
        $("#loginPanel").hidden = true;
        $("#editorPanel").hidden = false;
        applyLanguage();
        notify(adminText("loginSuccess"));
      } catch (error) {
        memoryToken = "";
        $("#patInput").value = "";
        notify(adminText("loginFailed") + ": " + error.message);
      } finally {
        button.disabled = false;
        button.textContent = adminText("loginButton");
      }
    });

    $("#profileFields").addEventListener("input", event => {
      const input = event.target.closest("[data-field]");
      if (!input) return;
      const { field: key, lang } = input.dataset;

      if (key === "tags") currentData.tags[lang] = input.value.split(/\r?\n/).map(x => x.trim()).filter(Boolean);
      else if (lang) currentData[key][lang] = input.value;
      else currentData[key] = input.value;

      markDirty();
    });

    for (const [selector, key] of [["#accentInput", "accent"], ["#accent2Input", "accent2"]]) {
      $(selector).addEventListener("input", event => {
        currentData.theme[key] = event.target.value;
        markDirty();
      });
    }

    bindListEditor("#adminSkills", "skills", renderSkillEditor);
    bindListEditor("#adminSocials", "socials", renderSocialEditor);

    $("#addSkill").addEventListener("click", () => {
      currentData.skills.push({ id: newId(), name: { fa: "", en: "" }, level: 50 });
      renderSkillEditor();
      markDirty();
    });

    $("#addSocial").addEventListener("click", () => {
      currentData.socials.push({ id: newId(), name: { fa: "", en: "" }, url: "" });
      renderSocialEditor();
      markDirty();
    });

    $("#adminProjects").addEventListener("click", event => {
      const button = event.target.closest("button[data-action]");
      if (!button) return;
      const { action, id } = button.dataset;

      if (action === "edit") {
        if (projectDraftDirty && !flushProjectDraft()) return;
        editingProjectId = id;
        projectDraftDirty = false;
        renderProjectFormFields();
        $("#projectFormHeading").scrollIntoView({ behavior: "smooth", block: "start" });
        return;
      }

      if (action === "delete") {
        if (!confirm(adminText("confirmDelete"))) return;
        currentData.projects = currentData.projects.filter(p => p.id !== id);
        if (editingProjectId === id) resetProjectForm();
      } else if (action === "up" || action === "down") {
        if (!moveItem(currentData.projects, id, action === "up" ? -1 : 1)) return;
      } else return;

      renderProjectEditorList();
      markDirty();
    });

    $("#projectForm").addEventListener("input", () => { projectDraftDirty = true; });
    $("#projectForm").addEventListener("submit", event => {
      event.preventDefault();
      flushProjectDraft();
    });
    $("#projectCancel").addEventListener("click", resetProjectForm);

    $("#copyFields").addEventListener("input", event => {
      const input = event.target.closest("[data-copy-key]");
      if (!input) return;
      currentData.ui[input.dataset.lang][input.dataset.copyKey] = input.value;
      markDirty();
    });

    $("#previewButton").addEventListener("click", () => {
      if (projectDraftDirty && !flushProjectDraft()) return;
      showPreview(true);
    });
    $("#backToEditor").addEventListener("click", () => showPreview(false));

    $("#exportButton").addEventListener("click", () => {
      if (projectDraftDirty && !flushProjectDraft()) return;
      const blob = new Blob([JSON.stringify(currentData, null, 2)], { type: "application/json" });
      const url = URL.createObjectURL(blob);
      const link = make("a");
      link.href = url;
      link.download = "portfolio_backup.json";
      document.body.append(link);
      link.click();
      link.remove();
      setTimeout(() => URL.revokeObjectURL(url), 30000);
    });

    $("#importButton").addEventListener("click", () => $("#importFile").click());
    $("#importFile").addEventListener("change", async event => {
      const file = event.target.files?.[0];
      event.target.value = "";
      if (!file || !confirm(adminText("confirmImport"))) return;

      try {
        if (file.size > 1_000_000) throw new Error("File too large");
        const parsed = JSON.parse(await file.text());
        if (!parsed.name || !Array.isArray(parsed.projects) || !Array.isArray(parsed.skills)) {
          throw new Error("Missing required portfolio fields");
        }
        currentData = normalize(parsed);
        activeCategory = "";
        editingProjectId = null;
        projectDraftDirty = false;
        applyLanguage();
        markDirty();
        notify(adminText("imported"));
      } catch {
        notify(adminText("invalidImport"));
      }
    });

    $("#commitButton").addEventListener("click", async () => {
      if (busy || !memoryToken) return;
      if (projectDraftDirty && !flushProjectDraft()) return;
      if (!validateBeforeSave()) return;
      if (!dirty) {
        notify(adminText("saved"));
        return;
      }

      busy = true;
      const button = $("#commitButton");
      button.disabled = true;
      button.textContent = adminText("saving");

      try {
        /* به‌روزرسانی خاموش SHA ممنوع: تعارض را به کاربر اعلام می‌کنیم. */
        const latest = await readRemoteFile();
        if ((latest?.sha ?? null) !== fileSha) {
          const conflict = new Error(adminText("conflict"));
          conflict.conflict = true;
          throw conflict;
        }

        const payload = {
          message: "Update bilingual portfolio via admin panel",
          content: encodeBase64Utf8(JSON.stringify(currentData, null, 2)),
          branch: CONFIG.branch
        };
        if (fileSha) payload.sha = fileSha;

        const result = await github(contentsEndpoint(), {
          method: "PUT",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(payload)
        });

        fileSha = result.content.sha;
        savedData = clone(currentData);
        dirty = false;
        $("#saveState").textContent = adminText("saved");
        notify(adminText("savedSuccess"));
      } catch (error) {
        if (error.conflict || [409, 422].includes(error.status)) {
          notify(adminText("conflict"));
        } else {
          notify(error.message);
        }
      } finally {
        busy = false;
        button.disabled = false;
        button.textContent = adminText("save");
      }
    });

    $("#logoutButton").addEventListener("click", () => {
      if ((dirty || projectDraftDirty) && !confirm(adminText("confirmLogout"))) return;
      memoryToken = "";
      fileSha = null;
      currentData = clone(savedData);
      dirty = false;
      editingProjectId = null;
      projectDraftDirty = false;
      $("#patInput").value = "";
      $("#editorPanel").hidden = true;
      $("#loginPanel").hidden = false;
      applyLanguage();
      window.scrollTo(0, 0);
    });

    window.addEventListener("beforeunload", event => {
      if (!dirty && !projectDraftDirty) return;
      event.preventDefault();
      event.returnValue = "";
    });

    /* راه‌اندازی سایت؛ نمایش عمومی نیازی به توکن ندارد. */
    (async function init() {
      $("#year").textContent = new Date().getFullYear();
      const isAdmin = new URLSearchParams(location.search).has("admin");

      if (isAdmin) {
        $("#siteView").hidden = true;
        $("#publicNav").hidden = true;
        $("#adminNav").hidden = false;
        $("#adminView").hidden = false;
        applyLanguage();
        return;
      }

      try {
        const response = await fetch("./" + CONFIG.path, { cache: "no-store" });
        if (response.ok) {
          currentData = normalize(await response.json());
        } else if (response.status === 404) {
          $("#siteWarning").hidden = false;
          $("#siteWarning").textContent = adminText("noFile");
        } else {
          throw new Error("HTTP " + response.status);
        }
      } catch {
        $("#siteWarning").hidden = false;
        $("#siteWarning").textContent = adminText("loadError");
      }

      applyLanguage();
    })();
  </script>
</body>
</html>
